name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:

# The test job only reads the repository, so keep the default token read-only.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      # persist-credentials: false keeps the checkout token out of .git/config,
      # where PR-controlled test code could otherwise read it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The unit tests only touch pure text/audio helpers, so they need a small
      # subset of the runtime dependencies instead of the full (heavy) install.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pysbd langdetect loguru pydub

      - name: Run tests
        run: pytest
